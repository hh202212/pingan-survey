name = "pingan-survey"
pages_build_output_dir = "public"
compatibility_date = "2024-09-18"

# D1 数据库绑定（Functions 中通过 env.DB 访问）
[[d1_databases]]
binding = "DB"
database_name = "pingan-survey"
database_id = "REPLACE_WITH_YOUR_D1_ID"   # 用 `wrangler d1 create pingan-survey` 返回的 id 替换

# 管理页访问口令（生产环境请改用机密：wrangler pages secret put ADMIN_KEY）
[vars]
ADMIN_KEY = "pingan888"
